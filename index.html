                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }
            
            async sendCode(phone) {
                this.phone = phone;
                this.code = this.generateSecureCode();
                const phoneKey = phone.replace(/[^0-9]/g, '');
                const hashedCode = await this.hashCode(this.code);
                
                await db.ref(`vfy/${phoneKey}`).set({
                    h: hashedCode, p: phone, t: Date.now(), a: 0, v: false,
                    e: Date.now() + (this.expiryTime * 1000)
                });
                
                this.showCode(this.code);
                
                setTimeout(async () => {
                    const snap = await db.ref(`vfy/${phoneKey}`).once('value');
                    if (snap.val() && !snap.val().v) await db.ref(`vfy/${phoneKey}`).remove();
                }, this.expiryTime * 1000);
                
                return { success: true };
            }
            
            async verifyCode(phone, userCode) {
                const phoneKey = phone.replace(/[^0-9]/g, '');
                const snapshot = await db.ref(`vfy/${phoneKey}`).once('value');
                const data = snapshot.val();
                
                if (!data || Date.now() > data.e) return { success: false, msg: 'Código expirado' };
                if (data.a >= this.maxAttempts) { await db.ref(`vfy/${phoneKey}`).remove(); return { success: false, msg: 'Bloqueado' }; }
                
                const inputHash = await this.hashCode(userCode);
                if (inputHash === data.h) {
                    await db.ref(`vfy/${phoneKey}`).update({ v: true });
                    return { success: true };
                } else {
                    await db.ref(`vfy/${phoneKey}`).update({ a: (data.a || 0) + 1 });
                    return { success: false, msg: 'Código incorreto' };
                }
            }
            
            showCode(code) {
                const overlay = document.createElement('div');
                overlay.className = 'verify-overlay active';
                overlay.innerHTML = `<div class="verify-box"><h3>🔐 Código de Verificação</h3><p style="color:var(--text2);font-size:12px;">Código enviado para seu dispositivo</p><div class="code-display">${code}</div><p style="color:var(--warning);font-size:11px;">⚠️ Não partilhe este código!</p><p class="timer">⏱️ Expira em: <span id="timerDisplay">05:00</span></p><button class="btn btn-primary" onclick="this.parentElement.parentElement.remove()">✅ Entendi</button></div>`;
                document.body.appendChild(overlay);
                
                this.secondsLeft = this.expiryTime;
                this.timerInterval = setInterval(() => {
                    this.secondsLeft--;
                    const display = document.getElementById('timerDisplay');
                    if (display) {
                        const m = Math.floor(this.secondsLeft / 60);
                        const s = this.secondsLeft % 60;
                        display.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    }
                    if (this.secondsLeft <= 0) { clearInterval(this.timerInterval); const ov = document.querySelector('.verify-overlay'); if (ov) ov.remove(); }
                }, 1000);
            }
        }

            e.preventDefault();

            const password = e.target.querySelector('input[type="password"]').value;

                let userData = null;
                snapshot.forEach(child => { userData = child.val(); });
                
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const passwordHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                if (userData.passwordHash !== passwordHash) return alert('❌ Senha incorreta!');

            const encoder = new TextEncoder();
            const data = encoder.encode(pass1);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const passwordHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            await verifier.sendCode(fullPhone);

        }
        
        function renderPlansPage(content) {
            content.innerHTML = `<div style="padding:10px;"><h3 style="text-align:center;margin:15px 0;">Seu Plano: <span style="color:var(--gold);">${PLANS[userPlan].name}</span></h3><div class="promote-card"><h3>🆓 Gratuito</h3><p>5 vídeos | 30 imagens | 40 artigos</p></div><div class="promote-card" style="border-color:var(--gold);"><h3>⭐ Premium Mensal</h3><p style="font-size:24px;color:var(--gold);font-weight:900;">100 MT/mês</p><p>50 vídeos | 200 imagens | Downloads offline</p><button class="btn btn-primary" onclick="upgradePlan('monthly')">💎 Assinar</button></div><div class="promote-card" style="border-color:var(--gold);"><h3>👑 Premium Anual</h3><p style="font-size:24px;color:var(--gold);font-weight:900;">1.000 MT/ano</p><p>500 vídeos | 2.000 imagens | Tudo ilimitado</p><button class="btn btn-primary" onclick="upgradePlan('yearly')">👑 Assinar</button></div></div>`;
        }
        
        async function upgradePlan(type) {
            const phone = prompt('📱 Número para confirmação:');
            if (phone) {
                await db.ref('payments/upgrades').push({ userId: currentUser?.uid, phone: sanitize(phone), plan: type, amount: PLANS[type].price, timestamp: Date.now(), status: 'pending' });
                alert('✅ Pedido enviado! Ativaremos em até 24h.');
            }
        }
        
        function renderSupportPage(content) {
            content.innerHTML = `<div class="promote-card"><h3>🎧 Suporte Técnico</h3><input type="text" id="ticketSubject" class="promote-input" placeholder="Assunto"><textarea id="ticketMessage" class="promote-input" style="min-height:100px;" placeholder="Descreva seu problema..."></textarea><button class="btn btn-primary" onclick="submitTicket()">📤 Enviar Ticket</button></div>`;
        }
        
        async function submitTicket() {
            const subject = sanitize(document.getElementById('ticketSubject')?.value.trim() || '');
            const message = sanitize(document.getElementById('ticketMessage')?.value.trim() || '');
            if (!subject || !message) return alert('Preencha todos os campos!');
            await db.ref('support/tickets').push({ subject, message, userId: currentUser?.uid, userName: sanitize(currentUser?.displayName || ''), timestamp: Date.now(), status: 'open' });
            alert('✅ Ticket enviado! Responderemos em breve.');
        }
        
        function renderFriendsList(content) {
            content.innerHTML = `<div class="promote-card"><h3>👫 Amigos</h3><input type="text" id="friendId" class="promote-input" placeholder="ID do amigo"><button class="btn btn-primary" onclick="addFriend()">+ Adicionar</button><div id="friendsList" style="margin-top:10px;"></div></div>`;
        }
        
        async function addFriend() {
            const friendId = sanitize(document.getElementById('friendId')?.value.trim() || '');
            if (!friendId) return;
            await db.ref(`friends/${currentUser?.uid}/${friendId}`).set({ name: 'Amigo', addedAt: Date.now() });
            alert('✅ Amigo adicionado!');
        }
        
        // ==========================================
        // CHAT (COM ANTI-SPAM)
        // ==========================================
        function toggleChat() { document.getElementById('chatPanel')?.classList.toggle('open'); }
        function loadChat() {
            db.ref('chat').limitToLast(30).on('child_added', s => {
                const m = s.val(); const b = document.getElementById('chatBody');
                if (b) { 
                    const div = document.createElement('div');
                    div.innerHTML = `<b>${sanitize(m.user||'Anónimo')}:</b> ${sanitize(m.text)}`;
                    b.appendChild(div);
                    b.scrollTop = b.scrollHeight; 
                }
            });
        }
        function sendChat() {
            const now = Date.now();
            // Anti-spam: 3 segundos entre mensagens
            if (now - lastMessageTime < 3000) {
                alert('⏳ Aguarde 3 segundos entre mensagens!');
                return;
            }
            lastMessageTime = now;
            
            const i = document.getElementById('chatInput'); if (!i) return;
            const t = sanitize(i.value.trim()); 
            if (t) { 
                db.ref('chat').push({ user: sanitize(currentUser?.displayName||'User'), text: t.substring(0, 200), timestamp: Date.now() }); 
                i.value = ''; 
            }
        }
        
        // ==========================================
        // SIDEBAR
        // ==========================================
        function toggleSidebar() {
            document.getElementById('sidebar')?.classList.toggle('open');
            document.getElementById('sidebarOverlay')?.classList.toggle('open');
        }
        
        // ==========================================
        // ADMIN (SENHA NO FIREBASE - NÃO NO CÓDIGO)
        // ==========================================
        function setupAdminDetection() {
            const btn = document.querySelector('.bottom-nav .nav-item:first-child');
            if (btn) btn.addEventListener('click', () => {
                if (!isAdmin && currentTab === 'home') {
                    homeClickCount++;
                    if (homeClickTimer) clearTimeout(homeClickTimer);
                    if (homeClickCount >= ADMIN_CLICKS) { homeClickCount = 0; document.getElementById('adminLock').classList.add('open'); }
                    homeClickTimer = setTimeout(() => { homeClickCount = 0; }, 2000);
                }
            });
        }
        
        async function verifyAdmin() {
            const p = document.getElementById('adminPassword')?.value;
            // Senha verificada NO FIREBASE, não no código
            const s = await db.ref('config/adminPassword').once('value');
            const storedPassword = s.val();
            
            // Se não existir senha no Firebase, criar padrão
            if (!storedPassword) {
                await db.ref('config/adminPassword').set('clipcash2024');
                if (p === 'clipcash2024') {
                    isAdmin = true;
                    document.getElementById('adminLock').classList.remove('open');
                    document.getElementById('adminPanel').classList.add('open');
                    return;
                }
            }
            
            if (p === storedPassword) { 
                isAdmin = true; 
                document.getElementById('adminLock').classList.remove('open'); 
                document.getElementById('adminPanel').classList.add('open'); 
            }
            else alert('❌ Senha incorreta!');
        }
        
        function closeAdminPanel() { document.getElementById('adminPanel').classList.remove('open'); isAdmin = false; }
        
        function adminConfigureTutorial() {
            const modal = document.getElementById('modalOverlay'), content = document.getElementById('modalContent');
            modal.classList.add('open');
            content.innerHTML = `<h3>📹 Configurar Vídeo Tutorial</h3><input type="text" id="tutorialUrl" class="promote-input" value="${tutorialConfig.url}"><input type="number" id="loopDuration" class="promote-input" value="${tutorialConfig.loopDuration}"><input type="text" id="captionText" class="promote-input" value="${tutorialConfig.caption}"><button class="btn btn-primary" onclick="saveTutorialConfig()">💾 Guardar</button><button class="btn btn-outline" style="margin-top:8px;" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cancelar</button>`;
        }
        
        function saveTutorialConfig() {
            const u = document.getElementById('tutorialUrl')?.value, d = document.getElementById('loopDuration')?.value, c = document.getElementById('captionText')?.value;
            if (u) tutorialConfig.url = u; if (d) tutorialConfig.loopDuration = parseInt(d); if (c) tutorialConfig.caption = sanitize(c);
            document.getElementById('modalOverlay').classList.remove('open');
            alert('✅ Configuração guardada!');
        }
        
        async function adminViewUpgrades() {
            const s = await db.ref('payments/upgrades').once('value');
            const u = s.val(); if (!u) return alert('Nenhum upgrade.');
            let list = 'Upgrades:\n\n'; Object.values(u).forEach(p => { list += `📱 ${sanitize(p.phone)} | ${p.plan} | ${p.amount} MT\n`; });
            alert(list);
        }
        
        function adminViewPromotions() { alert('🚀 Promoções: Verifique no Firebase Console'); }
        function adminSupportTickets() { alert('🎧 Tickets: Verifique no Firebase Console'); }
        function adminStats() { alert('📊 Estatísticas: Verifique no Firebase Console'); }
        async function adminChangePassword() { 
            const p = prompt('Nova senha:'); 
            if (p?.length >= 6) { 
                await db.ref('config/adminPassword').set(p); 
                alert('✅ Senha alterada com sucesso!'); 
            } else if (p) {
                alert('❌ Senha deve ter no mínimo 6 caracteres!');
            }
        }
        
        // ==========================================
        // INIT
        // ==========================================
        async function initApp() {
            const s = await db.ref('config/adminPassword').once('value');
            if (!s.val()) await db.ref('config/adminPassword').set('clipcash2024');
            
            auth.onAuthStateChanged(user => {
                if (user && isLoggedIn) { 
                    // Verificar expiração da sessão
                    if (sessionExpiry && Date.now() > sessionExpiry) {
                        auth.signOut();
                        isLoggedIn = false;
                        alert('⏰ Sessão expirada. Faça login novamente.');
                        renderLoginScreen();
                        return;
                    }
                    currentUser = user; 
                }
                else { renderLoginScreen(); }
            });
        }
        
        document.addEventListener('click', e => {
            if (e.target.classList.contains('sidebar-overlay')) toggleSidebar();
            if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('open');
        });
        
        initApp();
    </script>
</body>
</html>
