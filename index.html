            --bg: #0a0a0a;
            --card: #141414;
            --input: #1e1e1e;
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --success: #00b894;
            --danger: #ff4757;
            --warning: #fdcb6e;
            --text: #ffffff;
            --text2: #b2bec3;
            --border: #2d2d2d;
            --gold: #ffd700;
            --placard: #e63946;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        
        .app { 
            width: 100%; 
            max-width: 480px; 
            min-height: 100vh; 
            background: var(--bg);
            position: relative;
            overflow-x: hidden;
        }
        
        /* ========== LINKS PLACARD (TOP FIXO) ========== */
        .placard-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: linear-gradient(135deg, #1a0a0a, #2d0a0a);
            border-bottom: 2px solid var(--placard);
            position: sticky;
            top: 0;
            z-index: 25;
        }
        
        .placard-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 8px;
            border: 2px solid var(--placard);
            background: rgba(230,57,70,0.1);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .placard-btn:hover {
            background: var(--placard);
            transform: scale(1.02);
        }
        
        .placard-btn.whatsapp {
            background: #25d366;
            border-color: #25d366;
            color: #000;
        }
        
        /* ========== LOGIN ========== */
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 100%);
            text-align: center;
        }
        
        .login-logo {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--primary-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }
        
        .login-subtitle { color: var(--text2); font-size: 14px; margin-bottom: 15px; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .video-section {
            width: 100%;
            margin: 10px 0 20px;
            background: var(--card);
            border-radius: 16px;
            padding: 10px;
            border: 1px solid var(--border);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-caption {
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
            color: var(--gold);
            font-weight: 600;
        }

            width: 100%;
            max-width: 300px;
            padding: 15px 20px;
            border-radius: 50px;
            border: 2px solid #4285f4;
            background: #fff;
            color: #333;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(66,133,244,0.3);
        }
        
        .google-btn:hover { transform: translateY(-2px); }
        .google-btn:active { transform: scale(0.95); }

            width: 22px;
            height: 22px;
            background: conic-gradient(#4285f4 0% 25%, #34a853 25% 50%, #fbbc05 50% 75%, #ea4335 75% 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            font-weight: 900;
        }
        
        .login-footer {
            margin-top: 30px;
            color: var(--text2);
            font-size: 11px;
        }

            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(10,10,10,0.98);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 50px;
            z-index: 20;
            border-bottom: 1px solid var(--border);

            background: linear-gradient(135deg, var(--primary-light), var(--gold));

            -webkit-text-fill-color: transparent;
            cursor: pointer;

        .user-avatar { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; object-fit: cover; border: 2px solid var(--primary); }

            background: var(--card); transition: all 0.2s;
        }
        .platform-tab.active { background: var(--primary); color: white; border-color: var(--primary-light); }
        
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
            background: var(--card); z-index: 200; transition: left 0.3s; overflow-y: auto;
        }
        .sidebar.open { left: 0; }
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 199; display: none;
        }
        .sidebar-overlay.open { display: block; }
        .sidebar-header {
            padding: 20px 16px; background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex; align-items: center; gap: 12px;

        .sidebar-section { padding: 8px 0; border-bottom: 1px solid var(--border); }
        .sidebar-section h4 { padding: 8px 16px; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-item {

            cursor: pointer; font-size: 13px; transition: background 0.2s;
        }
        .sidebar-item:hover { background: var(--input); }

            position: fixed; bottom: 0; width: 100%; max-width: 480px;
            background: rgba(10,10,10,0.98); backdrop-filter: blur(20px);

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 4px 2px; color: var(--text2); font-size: 9px;
            cursor: pointer; border: none; background: transparent;

        .nav-item.active { color: var(--primary-light); }
        .nav-icon { font-size: 20px; }

            border-radius: 4px; font-size: 10px; font-weight: 600;

        .video-info { display: flex; padding: 10px 14px; gap: 10px; }

        }
        .video-details .meta { font-size: 11px; color: var(--text2); }
        
        .promote-card {

        .chat-panel {
            position: fixed; bottom: 70px; right: 10px; width: 300px;
            max-height: 400px; background: var(--card); border-radius: 12px;
            border: 1px solid var(--border); display: none; flex-direction: column;
            z-index: 150; overflow: hidden;
        }
        .chat-panel.open { display: flex; }
        .chat-header {
            padding: 10px 14px; background: var(--input);

        .chat-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; max-height: 280px; background: var(--bg); }
        .chat-body div { margin-bottom: 6px; padding: 8px 12px; background: var(--input); border-radius: 16px; font-size: 12px; }
        .chat-input { display: flex; padding: 8px; gap: 6px; background: var(--card); border-top: 1px solid var(--border); }
        .chat-input input {
            flex: 1; background: var(--input); border: 1px solid var(--border);
            border-radius: 20px; padding: 8px 14px; color: var(--text); font-size: 12px; outline: none;
        }
        .chat-input button {
            background: var(--primary); border: none; border-radius: 50%;
            width: 36px; height: 36px; color: white; font-size: 16px; cursor: pointer;
        }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 300; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--card); border-radius: 16px; padding: 24px;
            width: 100%; max-width: 380px; border: 1px solid var(--border);
            max-height: 80vh; overflow-y: auto;
        }
        
        .admin-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.97); z-index: 500; display: none; flex-direction: column;
        }
        .admin-panel.open { display: flex; }
        .admin-header {
            padding: 20px; background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--primary);
        }
        .admin-close {
            font-size: 24px; cursor: pointer; width: 36px; height: 36px;
            border-radius: 50%; background: var(--danger); display: flex;
            align-items: center; justify-content: center; border: none; color: white;
        }
        .admin-content { flex: 1; overflow-y: auto; padding: 16px; }
        .admin-card {
            background: var(--card); border-radius: 12px; padding: 16px;
            margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer;
        }
        .admin-card:hover { border-color: var(--primary); }
        .admin-lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 600; display: none;
            justify-content: center; align-items: center;
        }
        .admin-lock.open { display: flex; }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        
        .btn {
            width: 100%; padding: 14px; border-radius: 12px;
            border: none; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-sm { width: auto; padding: 7px 16px; font-size: 11px; border-radius: 8px; }
        .hidden { display: none !important; }
    </style>
</head>

                    </p>
                    
                    <div class="login-footer">
                        Ao continuar, concorda com os Termos de Serviço
                    </div>
                </div>
            `;
            setupTutorialVideo();
        }
        
        function setupTutorialVideo() {
            setTimeout(() => {
                const video = document.getElementById('tutorialVideo');
                if (video) {
                    video.loop = true; video.muted = true; video.playsInline = true;
                    video.play().catch(() => {});
                    video.addEventListener('timeupdate', function() {
                        if (video.currentTime >= tutorialConfig.loopDuration) video.currentTime = 0;
                    });
                }
            }, 500);
        }
        
        function trackClick(type) {
            db.ref('clicks').push({
                type: type,
                timestamp: Date.now(),
                userAgent: navigator.userAgent
            });
        }
        
        // ==========================================
        // LOGIN COM GOOGLE (COM RETRY)
        // ==========================================
        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            
            try {
                const result = await auth.signInWithPopup(provider);
                await handleGoogleUser(result.user);
            } catch (popupError) {
                console.log('Popup falhou:', popupError.code);
                
                if (popupError.code === 'auth/popup-closed-by-user') {
                    alert('❌ Janela fechada. Tente novamente.');
                    return;
                }
                
                if (popupError.code === 'auth/popup-blocked') {
                    alert('❌ Popup bloqueado! Permita popups para este site.');
                    return;
                }
                
                // Tentar redirect
                try {
                    await auth.signInWithRedirect(provider);
                } catch (redirectError) {
                    console.error('Erro:', redirectError);
                    alert('❌ Erro ao conectar. Tente novamente mais tarde.\n\nVerifique sua conexão com a internet.');
                }
            }
        }
        
        auth.getRedirectResult().then(async (result) => {
            if (result && result.user) await handleGoogleUser(result.user);
        }).catch((error) => {
            if (error.code !== 'auth/account-exists-with-different-credential') {
                console.error('Erro redirect:', error);
            }
        });
        
        async function handleGoogleUser(user) {
            currentUser = user;
            isLoggedIn = true;
            userPlan = 'free';
            userStats = { videosPosted: 0, imagesPosted: 0, articlesPosted: 0, downloadsUsed: 0 };
            
            const userSnap = await db.ref(`users/${user.uid}`).once('value');
            if (!userSnap.exists()) {
                await db.ref(`users/${user.uid}`).set({
                    name: user.displayName || 'Usuário Google',
                    email: user.email,
                    photo: user.photoURL,
                    plan: 'free',
                    stats: userStats,
                    createdAt: Date.now(),
                    verified: true,
                    authMethod: 'google'
                });
            } else {
                userPlan = userSnap.val().plan || 'free';
                userStats = userSnap.val().stats || userStats;
            }
            
            alert('✅ Bem-vindo, ' + (user.displayName || 'Usuário') + '!');
            renderMainApp();
        }
        
        // ==========================================
        // APP PRINCIPAL
        // ==========================================
        function renderMainApp() {
            const app = document.getElementById('app');
            const plan = PLANS[userPlan];
            const userPhoto = currentUser?.photoURL || '';
            
            app.innerHTML = `
                <!-- LINKS PLACARD NO TOPO -->
                <div class="placard-bar">
                    <a href="${placardLinks.deposit}" target="_blank" class="placard-btn" onclick="trackClick('deposit')">
                        💰 CLICA E GANHA NA PLACARD
                    </a>
                    <a href="${placardLinks.whatsapp}" target="_blank" class="placard-btn whatsapp" onclick="trackClick('whatsapp')">
                        📱 GRUPO WHATSAPP
                    </a>
                </div>
                
                <div class="header">
                    <span class="logo" onclick="switchTab('home')">💎 ClipCash</span>
                    <div class="header-right">
                        <span class="header-btn" onclick="switchTab('plans')">💎</span>
                        <span class="header-btn" onclick="switchTab('support')">🎧</span>
                        <span class="header-btn" onclick="toggleChat()">💬</span>
                        <span class="header-btn" onclick="toggleSidebar()">☰</span>
                        ${userPhoto ? `<img src="${userPhoto}" class="user-avatar" onclick="logout()" title="Sair">` : `<span class="header-btn" onclick="logout()">🚪</span>`}
                    </div>
                </div>
                
                <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        ${userPhoto ? `<img src="${userPhoto}" style="width:48px;height:48px;border-radius:50%;border:2px solid var(--primary);">` : '<div style="width:48px;height:48px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;">👤</div>'}
                        <div>
                            <div style="font-weight:700;">${sanitize(currentUser?.displayName || 'Utilizador')}</div>
                            <div style="font-size:10px;color:var(--gold);">Plano ${plan.name}</div>
                        </div>
                    </div>
                    <div class="sidebar-section"><h4>📺 Plataformas (${Object.keys(PLATFORMS).length})</h4>${Object.keys(PLATFORMS).slice(0,10).map(k => `<div class="sidebar-item" onclick="switchPlatform('${k}');toggleSidebar()"><span>${PLATFORMS[k].icon}</span> ${PLATFORMS[k].name}</div>`).join('')}</div>
                    <div class="sidebar-section"><h4>⚙️ Conta</h4><div class="sidebar-item" onclick="switchTab('plans');toggleSidebar()">💎 Planos</div><div class="sidebar-item" onclick="logout()">🚪 Sair</div></div>
                </div>
                
                <div class="feed" id="mainContent"></div>
                
                <div class="bottom-nav" id="bottomNav"></div>
                
                <div class="chat-panel" id="chatPanel">
                    <div class="chat-header">💬 Chat Global <span onclick="toggleChat()">✕</span></div>
                    <div class="chat-body" id="chatBody"></div>
                    <div class="chat-input"><input type="text" id="chatInput" placeholder="Mensagem..." onkeypress="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">▶</button></div>
                </div>
                
                <div class="admin-lock" id="adminLock">
                    <div style="background:var(--card);border-radius:16px;padding:30px;text-align:center;border:2px solid var(--primary);">
                        <h2>🔐 Admin</h2>
                        <input type="password" id="adminPassword" style="width:100%;padding:14px;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--text);text-align:center;font-size:16px;letter-spacing:8px;margin:15px 0;outline:none;" placeholder="Senha">
                        <button class="btn btn-primary" onclick="verifyAdmin()">Acessar</button>
                    </div>
                </div>
                
                <div class="admin-panel" id="adminPanel">
                    <div class="admin-header"><h2>🔐 Painel Admin</h2><button class="admin-close" onclick="closeAdminPanel()">✕</button></div>
                    <div class="admin-content">
                        <div class="admin-card" onclick="adminConfigureTutorial()"><h3>📹 Configurar Vídeo Tutorial</h3><p>Mudar vídeo e legenda</p></div>
                        <div class="admin-card" onclick="adminConfigurePlacard()"><h3>💰 Configurar Links Placard</h3><p>Links de afiliado e WhatsApp</p></div>
                        <div class="admin-card" onclick="adminViewUpgrades()"><h3>💎 Aprovar Upgrades</h3><p>Ver pagamentos</p></div>
                        <div class="admin-card" onclick="adminViewPromotions()"><h3>🚀 Promoções</h3><p>Aprovar vídeos</p></div>
                        <div class="admin-card" onclick="adminStats()"><h3>📊 Estatísticas</h3></div>
                        <div class="admin-card" onclick="adminChangePassword()"><h3>🔑 Alterar Senha</h3></div>
                    </div>
                </div>
            `;
            
            setupBottomNav();
            switchPlatform('youtube');
            loadChat();
            setupAdminDetection();
        }
        
        function setupBottomNav() {
            document.getElementById('bottomNav').innerHTML = `
                <button class="nav-item active" onclick="switchTab('home')"><span class="nav-icon">🏠</span>Início</button>
                <button class="nav-item" onclick="switchTab('promote')"><span class="nav-icon">🚀</span>Promover</button>
                <button class="nav-item" onclick="switchTab('create')"><span class="nav-icon" style="font-size:26px;">➕</span></button>
                <button class="nav-item" onclick="switchTab('plans')"><span class="nav-icon">💎</span>Planos</button>
                <button class="nav-item" onclick="switchTab('support')"><span class="nav-icon">🎧</span>Suporte</button>
            `;
        }
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
            const map = { home: 1, promote: 2, create: 3, plans: 4, support: 5 };
            document.querySelector(`.bottom-nav .nav-item:nth-child(${map[tab]})`)?.classList.add('active');
            const content = document.getElementById('mainContent');
            if (tab === 'home') switchPlatform(currentPlatform);
            else content.innerHTML = `<div class="promote-card"><h3>${tab.toUpperCase()}</h3><p style="color:var(--text2);">Disponível em breve!</p></div>`;
        }
        
        function switchPlatform(platform) {
            currentPlatform = platform;
            const content = document.getElementById('mainContent');
            let html = `<div class="platform-tabs">${Object.keys(PLATFORMS).slice(0,15).map(k => `<div class="platform-tab ${k===platform?'active':''}" onclick="switchPlatform('${k}')"><span>${PLATFORMS[k].icon}</span> ${PLATFORMS[k].name}</div>`).join('')}</div><div id="feedVideos">`;
            (videoDatabase[platform]||[]).slice(0,20).forEach(v => {
                html += `<div class="video-card" onclick="alert('🎬 ${sanitize(v.title)}')"><div class="video-thumb"><span style="font-size:48px;">${PLATFORMS[platform].icon}</span><span class="video-duration">${v.duration}</span></div><div class="video-info"><div class="channel-avatar" style="background:${PLATFORMS[platform].color};">${sanitize(v.channel.charAt(0))}</div><div class="video-details"><h3>${sanitize(v.title)}</h3><div class="meta">${sanitize(v.channel)} · ${formatNumber(v.views)} · ${v.timeAgo}</div></div></div></div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        }
        
        function toggleChat() { document.getElementById('chatPanel')?.classList.toggle('open'); }
        function loadChat() {
            db.ref('chat').limitToLast(30).on('child_added', s => {
                const m = s.val(), b = document.getElementById('chatBody');
                if (b) { const d = document.createElement('div'); d.innerHTML = `<b>${sanitize(m.user||'Anónimo')}:</b> ${sanitize(m.text)}`; b.appendChild(d); b.scrollTop = b.scrollHeight; }
            });
        }
        function sendChat() {
            const now = Date.now();
            if (now - lastMessageTime < 3000) return alert('⏳ Aguarde 3s!');
            lastMessageTime = now;
            const i = document.getElementById('chatInput'); if (!i) return;
            const t = sanitize(i.value.trim());
            if (t) { db.ref('chat').push({ user: sanitize(currentUser?.displayName||'User'), text: t.substring(0,200), timestamp: Date.now() }); i.value = ''; }
        }
        
        function toggleSidebar() { document.getElementById('sidebar')?.classList.toggle('open'); document.getElementById('sidebarOverlay')?.classList.toggle('open'); }
        
        function setupAdminDetection() {
            const btn = document.querySelector('.bottom-nav .nav-item:first-child');
            if (btn) btn.addEventListener('click', () => {
                if (!isAdmin && currentTab === 'home') {
                    homeClickCount++;
                    if (homeClickTimer) clearTimeout(homeClickTimer);
                    if (homeClickCount >= ADMIN_CLICKS) { homeClickCount = 0; document.getElementById('adminLock').classList.add('open'); }
                    homeClickTimer = setTimeout(() => { homeClickCount = 0; }, 2000);
                }
            });
        }
        
        async function verifyAdmin() {
            const p = document.getElementById('adminPassword')?.value;
            const s = await db.ref('config/adminPassword').once('value');
            const stored = s.val();
            if (!stored) await db.ref('config/adminPassword').set('clipcash2024');
            if (p === (stored || 'clipcash2024')) {
                isAdmin = true;
                document.getElementById('adminLock').classList.remove('open');
                document.getElementById('adminPanel').classList.add('open');
            } else alert('❌ Senha incorreta!');
        }
        
        function closeAdminPanel() { document.getElementById('adminPanel').classList.remove('open'); isAdmin = false; }
        
        function adminConfigureTutorial() {
            const modal = document.getElementById('modalOverlay'), content = document.getElementById('modalContent');
            modal.classList.add('open');
            content.innerHTML = `
                <h3>📹 Configurar Vídeo Tutorial</h3>
                <input type="text" id="tutorialUrl" class="promote-input" value="${tutorialConfig.url}" placeholder="URL do vídeo MP4">
                <input type="number" id="loopDuration" class="promote-input" value="${tutorialConfig.loopDuration}" placeholder="Duração do loop (s)">
                <input type="text" id="captionText" class="promote-input" value="${tutorialConfig.caption}" placeholder="Legenda">
                <button class="btn btn-primary" onclick="saveTutorialConfig()">💾 Guardar</button>
                <button class="btn btn-outline" style="margin-top:8px;" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cancelar</button>
            `;
        }
        
        function saveTutorialConfig() {
            const u = document.getElementById('tutorialUrl')?.value;
            const d = document.getElementById('loopDuration')?.value;
            const c = document.getElementById('captionText')?.value;
            if (u) tutorialConfig.url = u;
            if (d) tutorialConfig.loopDuration = parseInt(d);
            if (c) tutorialConfig.caption = sanitize(c);
            db.ref('config/tutorialVideo').set(tutorialConfig);
            document.getElementById('modalOverlay').classList.remove('open');
            alert('✅ Configuração guardada! Reinicie o app para ver as mudanças.');
        }
        
        function adminConfigurePlacard() {
            const modal = document.getElementById('modalOverlay'), content = document.getElementById('modalContent');
            modal.classList.add('open');
            content.innerHTML = `
                <h3>💰 Configurar Links Placard</h3>
                <label style="font-size:11px;color:var(--text2);">Link de Afiliado (Depósito)</label>
                <input type="text" id="depositLink" class="promote-input" value="${placardLinks.deposit}" placeholder="https://placard.co.mz/register?ref=...">
                <label style="font-size:11px;color:var(--text2);">Link do Grupo WhatsApp</label>
                <input type="text" id="whatsappLink" class="promote-input" value="${placardLinks.whatsapp}" placeholder="https://chat.whatsapp.com/...">
                <button class="btn btn-primary" onclick="savePlacardConfig()">💾 Guardar</button>
                <button class="btn btn-outline" style="margin-top:8px;" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cancelar</button>
            `;
        }
        
        function savePlacardConfig() {
            const d = document.getElementById('depositLink')?.value;
            const w = document.getElementById('whatsappLink')?.value;
            if (d) placardLinks.deposit = d;
            if (w) placardLinks.whatsapp = w;
            db.ref('config/placardLinks').set(placardLinks);
            document.getElementById('modalOverlay').classList.remove('open');
            alert('✅ Links guardados! As mudanças aparecerão ao reiniciar.');
        }
        
        function adminViewUpgrades() { alert('💎 Upgrades: Verifique no Firebase Console'); }
        function adminViewPromotions() { alert('🚀 Promoções: Verifique no Firebase Console'); }
        function adminStats() { alert('📊 Estatísticas: Verifique no Firebase Console'); }
        async function adminChangePassword() {
            const p = prompt('Nova senha admin:');
            if (p?.length >= 6) { await db.ref('config/adminPassword').set(p); alert('✅ Alterada!'); }
            else if (p) alert('❌ Mínimo 6 caracteres!');
        }
        
        async function logout() { await auth.signOut(); currentUser = null; isLoggedIn = false; renderLoginScreen(); }
        
        // ==========================================
        // INIT
        // ==========================================
        async function initApp() {
            await loadConfig();
            
            // Verificar se já existe adminPassword
            const s = await db.ref('config/adminPassword').once('value');
            if (!s.val()) await db.ref('config/adminPassword').set('clipcash2024');
            
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user; isLoggedIn = true;
                    const snap = await db.ref(`users/${user.uid}`).once('value');
                    if (snap.exists()) { userPlan = snap.val().plan || 'free'; userStats = snap.val().stats || userStats; }
                    renderMainApp();
                } else {
                    renderLoginScreen();
                }
            });
        }
        
        document.addEventListener('click', e => {
            if (e.target.classList.contains('sidebar-overlay')) toggleSidebar();
        });
        
        initApp();
    </script>
</body>
</html>
