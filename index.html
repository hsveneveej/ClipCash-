<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClipCash</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #0a0a0a;
            position: relative;
        }
        
        /* Login Screen - Mostrada imediatamente */
        .login-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #0a0a0a, #1a1a2e);
            text-align: center;
        }
        
        .login-logo {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #a29bfe, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-subtitle {
            color: #b2bec3;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .video-box {
            background: #141414;
            border-radius: 16px;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #2d2d2d;
            width: 100%;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }
        
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-caption {
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
            color: #ffd700;
            font-weight: 600;
        }
        
        .google-btn {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            border-radius: 50px;
            border: 2px solid #4285f4;
            background: white;
            color: #333;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        
        .google-btn:active {
            transform: scale(0.98);
        }
        
        .login-footer {
            margin-top: 30px;
            color: #b2bec3;
            font-size: 11px;
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: #0a0a0a;
            border-bottom: 1px solid #2d2d2d;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        
        .logo-text {
            font-weight: bold;
            font-size: 18px;
            background: linear-gradient(135deg, #a29bfe, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        
        .header-icons {
            display: flex;
            gap: 15px;
            margin-left: auto;
            align-items: center;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #6c5ce7;
            object-fit: cover;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            padding: 8px 12px;
            overflow-x: auto;
            background: #0a0a0a;
            border-bottom: 1px solid #2d2d2d;
            position: sticky;
            top: 53px;
            z-index: 19;
        }
        
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid #2d2d2d;
            background: #141414;
            color: white;
        }
        
        .tab.active {
            background: #6c5ce7;
            border-color: #a29bfe;
        }
        
        /* Content */
        .content {
            padding: 10px 0 70px;
            min-height: 100vh;
        }
        
        .video-item {
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        
        .video-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            position: relative;
        }
        
        .video-info {
            display: flex;
            padding: 10px 15px;
            gap: 10px;
        }
        
        .channel-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .video-text h3 {
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .video-text span {
            font-size: 11px;
            color: #b2bec3;
        }
        
        /* Bottom Nav */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #0a0a0a;
            padding: 8px 0 10px;
            border-top: 1px solid #2d2d2d;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #b2bec3;
            font-size: 9px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .nav-item.active {
            color: #a29bfe;
        }
        
        .nav-icon {
            font-size: 20px;
        }
        
        /* Cards */
        .card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px;
            margin: 12px;
            border: 2px solid #6c5ce7;
        }
        
        .input-field {
            width: 100%;
            padding: 12px;
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
            font-family: Arial, sans-serif;
        }
        
        .input-field:focus {
            border-color: #6c5ce7;
        }
        
        select.input-field {
            appearance: none;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary { background: #6c5ce7; color: white; }
        .btn-success { background: #00b894; color: white; }
        .btn-premium { background: linear-gradient(135deg, #ffd700, #ff6b6b); color: black; font-weight: bold; }
        .btn-outline { background: transparent; border: 1px solid #6c5ce7; color: #6c5ce7; }
        .btn-sm { width: auto; padding: 7px 16px; font-size: 11px; display: inline-block; }
        
        /* Plan Card */
        .plan-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px;
            margin: 12px;
            border: 2px solid #2d2d2d;
            text-align: center;
        }
        
        .plan-card.premium {
            border-color: #ffd700;
        }
        
        .plan-price {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }
        
        .plan-features {
            text-align: left;
            margin: 15px 0;
            list-style: none;
        }
        
        .plan-features li {
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid #2d2d2d;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: #141414;
            z-index: 200;
            transition: left 0.3s;
            overflow-y: auto;
        }
        
        .sidebar.open { left: 0; }
        
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 199;
            display: none;
        }
        
        .sidebar-overlay.open { display: block; }
        
        .sidebar-header {
            padding: 20px 16px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sidebar-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #2d2d2d;
        }
        
        .sidebar-item:active { background: #1e1e1e; }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.open { display: flex; }
        
        .modal-box {
            background: #141414;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #2d2d2d;
        }
        
        /* Admin */
        .admin-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 500;
            display: none;
            flex-direction: column;
        }
        
        .admin-panel.open { display: flex; }
        
        .admin-header {
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #6c5ce7;
        }
        
        .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .admin-card {
            background: #141414;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #2d2d2d;
            cursor: pointer;
        }
        
        .admin-card:active { border-color: #6c5ce7; }
        
        .admin-lock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 600;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .admin-lock.open { display: flex; }
        
        /* Chat */
        .chat-panel {
            position: fixed;
            bottom: 70px;
            right: 10px;
            width: 300px;
            max-height: 400px;
            background: #141414;
            border-radius: 12px;
            border: 1px solid #2d2d2d;
            display: none;
            flex-direction: column;
            z-index: 150;
            overflow: hidden;
        }
        
        .chat-panel.open { display: flex; }
        
        .chat-header {
            padding: 10px 14px;
            background: #1e1e1e;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            max-height: 280px;
            background: #0a0a0a;
        }
        
        .chat-messages div {
            margin-bottom: 6px;
            padding: 8px 12px;
            background: #1e1e1e;
            border-radius: 16px;
            font-size: 12px;
        }
        
        .chat-input-area {
            display: flex;
            padding: 8px;
            gap: 6px;
            background: #141414;
            border-top: 1px solid #2d2d2d;
        }
        
        .chat-input-area input {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 20px;
            padding: 8px 14px;
            color: white;
            font-size: 12px;
            outline: none;
        }
        
        .chat-input-area button {
            background: #6c5ce7;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- App Container -->
    <div class="app-container" id="app"></div>
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar"></div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    
    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-box" id="modalBox"></div>
    </div>
    
    <!-- Chat -->
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <span>💬 Chat</span>
            <span onclick="toggleChat()" style="cursor:pointer;">✕</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Mensagem..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">▶</button>
        </div>
    </div>
    
    <!-- Admin Lock -->
    <div class="admin-lock" id="adminLock">
        <div style="background:#141414;border-radius:16px;padding:30px;text-align:center;border:2px solid #6c5ce7;">
            <h2>🔐 Admin</h2>
            <input type="password" id="adminPass" class="input-field" style="text-align:center;font-size:16px;letter-spacing:5px;margin:15px 0;" placeholder="Senha">
            <button class="btn btn-primary" onclick="verifyAdmin()">Acessar</button>
        </div>
    </div>
    
    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h2>🔐 Painel Admin</h2>
            <button onclick="closeAdmin()" style="background:#ff4757;border:none;color:white;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;">✕</button>
        </div>
        <div class="admin-content" id="adminContent"></div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDH-VISUVxdjtdpqC0CqsmYmTg76H5meaQ",
            authDomain: "clipcash-120b6.firebaseapp.com",
            databaseURL: "https://clipcash-120b6-default-rtdb.firebaseio.com",
            projectId: "clipcash-120b6",
            storageBucket: "clipcash-120b6.firebasestorage.app",
            messagingSenderId: "1061922736430",
            appId: "1:1061922736430:web:d099bb4bf79db1f9e652bf"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();
        
        // Set persistence
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        
        // Platforms
        const PLATFORMS = {
            youtube: {name:'YouTube',icon:'▶️',color:'#ff0000'},
            tiktok: {name:'TikTok',icon:'🎵',color:'#ff0050'},
            instagram: {name:'Instagram',icon:'📷',color:'#e4405f'},
            facebook: {name:'Facebook',icon:'📘',color:'#1877f2'},
            twitter: {name:'Twitter/X',icon:'🐦',color:'#1da1f2'},
            linkedin: {name:'LinkedIn',icon:'💼',color:'#0a66c2'},
            snapchat: {name:'Snapchat',icon:'👻',color:'#fffc00'},
            pinterest: {name:'Pinterest',icon:'📌',color:'#e60023'},
            reddit: {name:'Reddit',icon:'🤖',color:'#ff4500'},
            discord: {name:'Discord',icon:'🎮',color:'#5865f2'},
            twitch: {name:'Twitch',icon:'🎥',color:'#9146ff'},
            telegram: {name:'Telegram',icon:'✈️',color:'#0088cc'},
            whatsapp: {name:'WhatsApp',icon:'💬',color:'#25d366'},
            spotify: {name:'Spotify',icon:'🎧',color:'#1db954'},
            onlyfans: {name:'OnlyFans',icon:'🔞',color:'#008ccf'}
        };
        
        const PLANS = {
            free: {name:'Grátis',price:0,videos:5,images:30,articles:40},
            monthly: {name:'Premium Mensal',price:100,videos:50,images:200,articles:200},
            yearly: {name:'Premium Anual',price:1000,videos:500,images:2000,articles:2000}
        };
        
        let currentUser = null;
        let userPlan = 'free';
        let userStats = {videosPosted:0,imagesPosted:0,articlesPosted:0};
        let currentPlatform = 'youtube';
        let currentTab = 'home';
        let isAdmin = false;
        let clickCount = 0;
        let clickTimer = null;
        let lastMsgTime = 0;
        
        let tutorialUrl = "https://www.w3schools.com/html/mov_bbb.mp4";
        let placardDeposit = "#";
        let placardWhatsapp = "#";
        
        function safe(s) {
            if(!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
        
        function formatNum(n) {
            if(!n) return '0';
            if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if(n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n.toLocaleString();
        }
        
        // ==================== LOGIN - MOSTRADO IMEDIATAMENTE ====================
        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-screen">
                    <div class="login-logo">💎 ClipCash</div>
                    <div class="login-subtitle">Ganhe dinheiro assistindo vídeos</div>
                    
                    <div class="video-box">
                        <div class="video-wrapper">
                            <video id="tutVideo" muted playsinline loop>
                                <source src="${tutorialUrl}" type="video/mp4">
                            </video>
                        </div>
                        <p class="video-caption">😂 "Ganhar dinheiro aqui é mais fácil que dançar!"</p>
                    </div>
                    
                    <button class="google-btn" onclick="doLogin()">
                        <span style="font-size:18px;">G</span> Entrar com Google
                    </button>
                    
                    <p style="color:#b2bec3;font-size:12px;margin-top:20px;">🔒 Login seguro via Google</p>
                    <div class="login-footer">Ao continuar, concorda com os Termos de Serviço</div>
                </div>
            `;
            
            setTimeout(() => {
                const v = document.getElementById('tutVideo');
                if(v) v.play().catch(() => {});
            }, 500);
        }
        
        async function doLogin() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await auth.signInWithPopup(provider);
                await handleUser(result.user);
            } catch(e) {
                if(e.code === 'auth/popup-closed-by-user') return;
                if(e.code === 'auth/popup-blocked') {
                    alert('Permita popups para fazer login!');
                    return;
                }
                alert('Erro no login. Tente novamente.');
            }
        }
        
        async function handleUser(user) {
            currentUser = user;
            userPlan = 'free';
            userStats = {videosPosted:0, imagesPosted:0, articlesPosted:0};
            
            try {
                const snap = await db.ref('users/' + user.uid).once('value');
                if(!snap.exists()) {
                    await db.ref('users/' + user.uid).set({
                        name: user.displayName || 'Usuário',
                        email: user.email,
                        photo: user.photoURL,
                        plan: 'free',
                        stats: userStats,
                        createdAt: Date.now()
                    });
                } else {
                    const data = snap.val();
                    userPlan = data.plan || 'free';
                    userStats = data.stats || userStats;
                }
            } catch(e) {}
            
            alert('✅ Bem-vindo, ' + (user.displayName || 'Usuário') + '!');
            renderApp();
        }
        
        // ==================== MAIN APP ====================
        function renderApp() {
            const photo = currentUser?.photoURL || '';
            
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="logo-text" id="logoClick">💎 ClipCash</span>
                    <div class="header-icons">
                        <button class="icon-btn" onclick="openTab('plans')">💎</button>
                        <button class="icon-btn" onclick="openTab('support')">🎧</button>
                        <button class="icon-btn" onclick="toggleChat()">💬</button>
                        <button class="icon-btn" onclick="openSidebar()">☰</button>
                        ${photo ? `<img src="${photo}" class="avatar" onclick="doLogout()" title="Sair">` : `<button class="icon-btn" onclick="doLogout()">🚪</button>`}
                    </div>
                </div>
                <div class="content" id="mainContent"></div>
                <div class="bottom-nav">
                    <button class="nav-item active" onclick="openTab('home')"><span class="nav-icon">🏠</span>Início</button>
                    <button class="nav-item" onclick="openTab('promote')"><span class="nav-icon">🚀</span>Crescer</button>
                    <button class="nav-item" onclick="openTab('create')"><span class="nav-icon" style="font-size:24px;">➕</span></button>
                    <button class="nav-item" onclick="openTab('plans')"><span class="nav-icon">💎</span>Planos</button>
                    <button class="nav-item" onclick="openTab('support')"><span class="nav-icon">🎧</span>Suporte</button>
                </div>
            `;
            
            renderSidebar();
            showHome();
            setupChat();
            setupAdminTrigger();
        }
        
        function renderSidebar() {
            const photo = currentUser?.photoURL || '';
            document.getElementById('sidebar').innerHTML = `
                <div class="sidebar-header">
                    ${photo ? `<img src="${photo}" style="width:48px;height:48px;border-radius:50%;border:2px solid #6c5ce7;">` : '<div style="width:48px;height:48px;border-radius:50%;background:#6c5ce7;display:flex;align-items:center;justify-content:center;font-size:20px;">👤</div>'}
                    <div>
                        <div style="font-weight:bold;">${safe(currentUser?.displayName || 'Usuário')}</div>
                        <div style="font-size:10px;color:#ffd700;">Plano ${PLANS[userPlan].name}</div>
                    </div>
                </div>

        function handleFile(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 100*1024*1024) { alert('Arquivo muito grande!'); return; }
            selectedFile = file;
            selectedFileType = file.type.startsWith('image/') ? 'image' : 'video';
            const preview = document.getElementById('mediaPreview');
            if(preview && selectedFileType === 'image') {
                const reader = new FileReader();
                reader.onload = ev => { preview.innerHTML = `<img src="${ev.target.result}" style="max-width:100%;max-height:200px;border-radius:8px;">`; };
                reader.readAsDataURL(file);
            }
            if(preview && selectedFileType === 'video') {
                preview.innerHTML = `<p style="color:#ffd700;">🎬 ${file.name}</p>`;
            }
        }
        
        async function publishPost() {
            const text = document.getElementById('postText')?.value?.trim();
            if(!text && !selectedFile) { alert('Escreva algo!'); return; }
            if(text) userStats.articlesPosted++;
            if(selectedFile) {
                if(selectedFileType === 'image') userStats.imagesPosted++;
                else userStats.videosPosted++;
            }
            try {
                await db.ref('users/' + currentUser.uid + '/stats').set(userStats);
                const postData = { content: safe(text || ''), userName: safe(currentUser?.displayName || 'Usuário'), timestamp: Date.now() };
                if(selectedFile) {
                    const ref = storage.ref('posts/' + currentUser.uid + '/' + Date.now());
                    await ref.put(selectedFile);
                    postData.mediaUrl = await ref.getDownloadURL();
                }
                await db.ref('posts').push(postData);
                alert('✅ Publicado!');
                openTab('home');
                selectedFile = null;
            } catch(e) { alert('Erro: ' + e.message); }

        }
        
        async function saveLinks() {
            const platform = document.getElementById('linkPlat')?.value;
            const text = document.getElementById('linkText')?.value;
            if(!platform || !text) { alert('Preencha!'); return; }
            const links = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('http'));
            if(links.length === 0) { alert('Nenhum link válido!'); return; }
            try {
                await db.ref('growthLinks/' + platform).set({links, count: links.length, updatedAt: Date.now()});
                alert('✅ ' + links.length + ' links salvos!');
                loadLinks();
            } catch(e) { alert('Erro'); }
        }
        
        async function loadLinks() {
            const platform = document.getElementById('linkPlat')?.value;
            const container = document.getElementById('existingLinks');
            if(!platform || !container) return;
            try {
                const snap = await db.ref('growthLinks/' + platform).once('value');
                const data = snap.val();
                if(data?.links) {
                    let html = `<p style="color:#ffd700;margin-bottom:8px;">Total: ${data.count} links</p>`;
                    data.links.slice(0,50).forEach(link => {
                        html += `<div style="padding:6px;background:#141414;border-radius:4px;margin-bottom:4px;font-size:10px;word-break:break-all;">${link}</div>`;
                    });
                    if(data.links.length > 50) html += `<p style="color:#b2bec3;text-align:center;">...e mais ${data.links.length-50} links</p>`;
                    container.innerHTML = html;
                } else { container.innerHTML = '<p style="color:#b2bec3;">Nenhum link</p>'; }
            } catch(e) { container.innerHTML = '<p style="color:#ff4757;">Erro</p>'; }
        }
        
        async function adminStats() {
            const modal = document.getElementById('modal');
            const box = document.getElementById('modalBox');
            modal.classList.add('open');
            try {
                const usersSnap = await db.ref('users').once('value');
                const postsSnap = await db.ref('posts').once('value');
                box.innerHTML = `<h3 style="margin-bottom:15px;">📊 Estatísticas</h3><div style="background:#1e1e1e;padding:15px;border-radius:10px;"><p>👥 <b>Usuários:</b> ${usersSnap.numChildren()}</p><p>📝 <b>Publicações:</b> ${postsSnap.numChildren()}</p></div><button class="btn btn-outline" style="margin-top:10px;" onclick="closeModal()">Fechar</button>`;
            } catch(e) { box.innerHTML = '<p>Erro</p>'; }
        }
        
        async function adminPassword() {
            const pass = prompt('Nova senha (mín 6 caracteres):');
            if(pass?.length >= 6) {
                await db.ref('config/adminPassword').set(pass);
                alert('✅ Alterada!');
            }
        }
        
        async function doLogout() {
            await auth.signOut();
            currentUser = null;
            userPlan = 'free';
            renderLogin();
        }
        
        // ==================== INIT ====================
        async function init() {
            // Load config
            try {
                const tc = await db.ref('config/tutorialVideo').once('value');
                if(tc.val()) tutorialUrl = tc.val().url || tutorialUrl;
                const pc = await db.ref('config/placardLinks').once('value');
                if(pc.val()) {
                    placardDeposit = pc.val().deposit || placardDeposit;
                    placardWhatsapp = pc.val().whatsapp || placardWhatsapp;
                }
                const ap = await db.ref('config/adminPassword').once('value');
                if(!ap.exists()) await db.ref('config/adminPassword').set('clipcash2024');
            } catch(e) {}
            
            // Check auth state
            auth.onAuthStateChanged(async (user) => {
                if(user) {
                    currentUser = user;
                    try {
                        const snap = await db.ref('users/' + user.uid).once('value');
                        if(snap.exists()) {
                            const data = snap.val();
                            userPlan = data.plan || 'free';
                            userStats = data.stats || userStats;
                        }
                    } catch(e) {}
                    renderApp();
                } else {
                    renderLogin();
                }
            });
        }
        
        // Start immediately
        init();
        
        // Event listeners
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        document.getElementById('modal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
    </script>
</body>
</html>
