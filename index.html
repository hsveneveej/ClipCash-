    </style>

        function trackClick(type) { db.ref('clicks').push({ type, timestamp: Date.now() }); }

        // ==========================================
        // GOOGLE LOGIN
        // ==========================================
        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                const result = await auth.signInWithPopup(provider);
                await handleGoogleUser(result.user);
            } catch(e) {
                if(e.code==='auth/popup-closed-by-user') return alert('❌ Janela fechada.');
                if(e.code==='auth/popup-blocked') return alert('❌ Permita popups!');
                try { await auth.signInWithRedirect(provider); } catch(err) { alert('❌ Erro. Tente novamente.'); }
            }
        }
        auth.getRedirectResult().then(async (result) => { if(result?.user) await handleGoogleUser(result.user); }).catch(()=>{});
        async function handleGoogleUser(user) {
            currentUser = user; isLoggedIn = true; userPlan = 'free'; userStats = {videosPosted:0,imagesPosted:0,articlesPosted:0,downloadsUsed:0};
            const snap = await db.ref(`users/${user.uid}`).once('value');
            if(!snap.exists()) await db.ref(`users/${user.uid}`).set({ name: user.displayName||'Usuário', email: user.email, photo: user.photoURL, plan: 'free', stats: userStats, createdAt: Date.now(), verified: true, authMethod: 'google' });
            else { userPlan = snap.val().plan||'free'; userStats = snap.val().stats||userStats; }
            alert('✅ Bem-vindo, '+(user.displayName||'Usuário')+'!'); renderMainApp();
        }

        // ==========================================
        // APP PRINCIPAL (TUDO RECUPERADO)
        // ==========================================
        function renderMainApp() {
            const app = document.getElementById('app'), plan = PLANS[userPlan], userPhoto = currentUser?.photoURL||'';
            const remaining = { videos: plan.videos - userStats.videosPosted, images: plan.images - userStats.imagesPosted, articles: plan.articles - userStats.articlesPosted };
            
            app.innerHTML = `
                <div class="placard-bar">
                    <a href="${placardLinks.deposit}" target="_blank" class="placard-btn" onclick="trackClick('deposit')">💰 CLICA E GANHA NA PLACARD</a>
                    <a href="${placardLinks.whatsapp}" target="_blank" class="placard-btn whatsapp" onclick="trackClick('whatsapp')">📱 GRUPO WHATSAPP</a>
                </div>
                <div class="header">
                    <span class="logo" onclick="switchTab('home')">💎 ClipCash</span>
                    <div class="header-right">
                        <span class="header-btn" onclick="switchTab('plans')">💎</span>
                        <span class="header-btn" onclick="switchTab('support')">🎧</span>
                        <span class="header-btn" onclick="toggleChat()">💬</span>
                        <span class="header-btn" onclick="toggleSidebar()">☰</span>
                        ${userPhoto ? `<img src="${userPhoto}" class="user-avatar" onclick="logout()" title="Sair">` : `<span class="header-btn" onclick="logout()">🚪</span>`}
                    </div>
                </div>
                <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">${userPhoto ? `<img src="${userPhoto}" style="width:48px;height:48px;border-radius:50%;border:2px solid var(--primary);">` : '<div style="width:48px;height:48px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;">👤</div>'}<div><div style="font-weight:700;">${sanitize(currentUser?.displayName||'Utilizador')}</div><div style="font-size:10px;color:var(--gold);">Plano ${plan.name}</div></div></div>
                    <div class="sidebar-section"><h4>📺 Plataformas (${Object.keys(PLATFORMS).length})</h4>${Object.keys(PLATFORMS).slice(0,10).map(k => `<div class="sidebar-item" onclick="switchPlatform('${k}');toggleSidebar()"><span>${PLATFORMS[k].icon}</span> ${PLATFORMS[k].name}</div>`).join('')}<div class="sidebar-item" onclick="showAllPlatforms();toggleSidebar()">📋 Ver Todas</div></div>
                    <div class="sidebar-section"><h4>💰 Promover</h4><div class="sidebar-item" onclick="switchTab('promote');toggleSidebar()">🚀 Pagar para Crescer</div></div>
                    <div class="sidebar-section"><h4>⚙️ Conta</h4><div class="sidebar-item" onclick="switchTab('plans');toggleSidebar()">💎 Planos</div><div class="sidebar-item" onclick="logout()">🚪 Sair</div></div>
                </div>
                <div class="feed" id="mainContent"></div>
                <div class="bottom-nav" id="bottomNav"></div>
                <div class="chat-panel" id="chatPanel"><div class="chat-header">💬 Chat Global <span onclick="toggleChat()">✕</span></div><div class="chat-body" id="chatBody"></div><div class="chat-input"><input type="text" id="chatInput" placeholder="Mensagem..." onkeypress="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">▶</button></div></div>
                <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalContent"></div></div>
                <div class="admin-lock" id="adminLock"><div style="background:var(--card);border-radius:16px;padding:30px;text-align:center;border:2px solid var(--primary);"><h2>🔐 Admin</h2><input type="password" id="adminPassword" style="width:100%;padding:14px;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--text);text-align:center;font-size:16px;letter-spacing:8px;margin:15px 0;outline:none;" placeholder="Senha"><button class="btn btn-primary" onclick="verifyAdmin()">Acessar</button></div></div>
                <div class="admin-panel" id="adminPanel"><div class="admin-header"><h2>🔐 Painel Admin</h2><button class="admin-close" onclick="closeAdminPanel()">✕</button></div><div class="admin-content">
                    <div class="admin-card" onclick="adminConfigureTutorial()"><h3>📹 Configurar Vídeo Tutorial</h3></div>
                    <div class="admin-card" onclick="adminConfigurePlacard()"><h3>💰 Configurar Links Placard</h3></div>
                    <div class="admin-card" onclick="adminViewUpgrades()"><h3>💎 Aprovar Upgrades</h3></div>
                    <div class="admin-card" onclick="adminViewPromotions()"><h3>🚀 Promoções</h3></div>
                    <div class="admin-card" onclick="adminSupportTickets()"><h3>🎧 Suporte</h3></div>
                    <div class="admin-card" onclick="adminStats()"><h3>📊 Estatísticas</h3></div>
                    <div class="admin-card" onclick="adminChangePassword()"><h3>🔑 Alterar Senha</h3></div>
                </div></div>
            `;
            setupBottomNav(); switchPlatform('youtube'); loadChat(); setupAdminDetection();
        }

        function setupBottomNav() {
            document.getElementById('bottomNav').innerHTML = `
                <button class="nav-item active" onclick="switchTab('home')"><span class="nav-icon">🏠</span>Início</button>
                <button class="nav-item" onclick="switchTab('promote')"><span class="nav-icon">🚀</span>Promover</button>
                <button class="nav-item" onclick="switchTab('create')"><span class="nav-icon" style="font-size:26px;">➕</span></button>
                <button class="nav-item" onclick="switchTab('plans')"><span class="nav-icon">💎</span>Planos</button>
                <button class="nav-item" onclick="switchTab('support')"><span class="nav-icon">🎧</span>Suporte</button>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
            const map = { home: 1, promote: 2, create: 3, plans: 4, support: 5 };
            document.querySelector(`.bottom-nav .nav-item:nth-child(${map[tab]})`)?.classList.add('active');
            const content = document.getElementById('mainContent');
            switch(tab) {
                case 'home': switchPlatform(currentPlatform); break;
                case 'promote': renderPromotePage(content); break;
                case 'create': renderCreatePost(content); break;
                case 'plans': renderPlansPage(content); break;
                case 'support': renderSupportPage(content); break;
            }
        }

        function switchPlatform(platform) {
            currentPlatform = platform;
            const content = document.getElementById('mainContent');
            let html = `<div class="platform-tabs">${Object.keys(PLATFORMS).slice(0,15).map(k => `<div class="platform-tab ${k===platform?'active':''}" onclick="switchPlatform('${k}')"><span>${PLATFORMS[k].icon}</span> ${PLATFORMS[k].name}</div>`).join('')}<div class="platform-tab" onclick="showAllPlatforms()">📋 Todas</div></div><div id="feedVideos">`;
            (videoDatabase[platform]||[]).slice(0,20).forEach(v => {
                html += `<div class="video-card" onclick="alert('🎬 ${sanitize(v.title)}')"><div class="video-thumb"><span style="font-size:48px;">${PLATFORMS[platform].icon}</span><span class="video-duration">${v.duration}</span></div><div class="video-info"><div class="channel-avatar" style="background:${PLATFORMS[platform].color};">${sanitize(v.channel.charAt(0))}</div><div class="video-details"><h3>${sanitize(v.title)}</h3><div class="meta">${sanitize(v.channel)} · ${formatNumber(v.views)} · ${v.timeAgo}</div></div></div></div>`;
            });
            html += '</div>'; content.innerHTML = html;
        }

        function showAllPlatforms() {
            const modal = document.getElementById('modalOverlay'), content = document.getElementById('modalContent');
            modal.classList.add('open');
            let html = `<h3>📺 Todas as Plataformas (${Object.keys(PLATFORMS).length})</h3><div style="max-height:400px;overflow-y:auto;">`;
            Object.keys(PLATFORMS).forEach(key => {
                html += `<div style="padding:10px;background:var(--input);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px;" onclick="switchPlatform('${key}');document.getElementById('modalOverlay').classList.remove('open')"><span style="font-size:20px;">${PLATFORMS[key].icon}</span><span>${PLATFORMS[key].name}</span><span style="margin-left:auto;color:var(--gold);">${PLATFORMS[key].price} MT</span></div>`;
            });
            html += '</div><button class="btn btn-outline" style="margin-top:10px;" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'open\')">Fechar</button>';
            content.innerHTML = html;
        }

        function renderPromotePage(content) {
            if(!PLANS[userPlan].promotion) { content.innerHTML = `<div class="promote-card" style="text-align:center;"><h3>🚀 Promoção Exclusiva</h3><p style="color:var(--text2);">Disponível para Premium!</p><button class="btn btn-primary" onclick="switchTab('plans')">💎 Ver Planos</button></div>`; return; }
            content.innerHTML = `<div class="promote-card"><h3>🚀 Promova sua Conta</h3><select id="promotePlatform" class="promote-input">${Object.keys(PLATFORMS).map(k => `<option value="${k}">${PLATFORMS[k].icon} ${PLATFORMS[k].name} - ${PLATFORMS[k].price} MT</option>`).join('')}</select><input type="text" id="promoteName" class="promote-input" placeholder="Seu nome"><input type="tel" id="promotePhone" class="promote-input" placeholder="Seu número"><input type="text" id="promoteLink" class="promote-input" placeholder="Link do seu vídeo"><select id="paymentMethod" class="promote-input"><option value="mpesa">📱 M-Pesa</option><option value="emola">📱 E-Mola</option><option value="bank">🏦 Banco</option></select><button class="btn btn-primary" onclick="submitPromotion()">💸 Solicitar Promoção</button></div>`;
        }

        async function submitPromotion() {
            const platform = document.getElementById('promotePlatform')?.value;
            const name = sanitize(document.getElementById('promoteName')?.value?.trim()||'');
            const phone = sanitize(document.getElementById('promotePhone')?.value?.trim()||'');
            const link = sanitize(document.getElementById('promoteLink')?.value?.trim()||'');
            const method = document.getElementById('paymentMethod')?.value;
            if(!name||!phone||!link) return alert('Preencha todos!');
            await db.ref('payments/promotions').push({ platform, name, phone, link, method, amount: PLATFORMS[platform].price, userId: currentUser?.uid, timestamp: Date.now(), status: 'pending' });
            alert('✅ Pedido enviado!');
        }

        function renderCreatePost(content) {
            const remaining = { videos: PLANS[userPlan].videos - userStats.videosPosted, images: PLANS[userPlan].images - userStats.imagesPosted, articles: PLANS[userPlan].articles - userStats.articlesPosted };
            content.innerHTML = `<div class="create-post"><h3 style="margin-bottom:12px;">📝 Criar Publicação</h3><div style="display:flex;gap:10px;margin-bottom:12px;font-size:11px;"><span>🎬 Vídeos: ${remaining.videos}</span><span>📷 Imagens: ${remaining.images}</span><span>📝 Artigos: ${remaining.articles}</span></div><textarea id="postText" placeholder="Escreva seu artigo..."></textarea><div id="mediaPreview" style="margin-top:10px;"></div><div class="create-actions"><button class="create-btn" onclick="selectMedia('image/*','image')">📷 Imagem</button><button class="create-btn" onclick="selectMedia('video/*','video')">🎬 Vídeo</button></div><input type="file" id="mediaInput" style="display:none;" onchange="handleMediaSelect(event)"><div class="upload-progress" id="postUploadProgress"><div class="bar" id="postUploadBar" style="width:0%"></div></div><button class="btn btn-primary" style="margin-top:12px;" onclick="publishPost()">📤 Publicar</button></div>`;
        }

        let selectedMediaFile = null, selectedMediaType = null;
        function selectMedia(accept, type) { const input = document.getElementById('mediaInput'); if(input) { input.accept = accept; input.dataset.type = type; input.click(); } }
        function handleMediaSelect(event) {
            const file = event.target.files[0]; if(!file) return;
            const validation = validateFile(file);
            if(!validation.valid) { alert('❌ '+validation.error); event.target.value = ''; return; }
            selectedMediaFile = file; selectedMediaType = document.getElementById('mediaInput')?.dataset.type;
            const preview = document.getElementById('mediaPreview');
            if(preview && selectedMediaType==='image') { const reader = new FileReader(); reader.onload = e => { preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%;max-height:200px;border-radius:8px;">`; }; reader.readAsDataURL(file); }
        }
        async function publishPost() {
            const text = sanitize(document.getElementById('postText')?.value?.trim()||'');
            if(!text && !selectedMediaFile) return alert('Escreva algo!');
            if(text) userStats.articlesPosted++;
            if(selectedMediaFile) { if(selectedMediaType==='image') userStats.imagesPosted++; else userStats.videosPosted++; }
            await db.ref(`users/${currentUser?.uid}/stats`).set(userStats);
            const postData = { content: text, userName: sanitize(currentUser?.displayName||'Utilizador'), timestamp: Date.now(), likes: {}, comments: {} };
            if(selectedMediaFile) {
                const fileId = `post_${Date.now()}_${Math.random().toString(36).substr(2,5)}`;
                const folder = selectedMediaType==='image'?'images':'videos';
                const storageRef = storage.ref(`${folder}/${currentUser?.uid}/${fileId}`);
                await storageRef.put(selectedMediaFile); postData.mediaUrl = await storageRef.getDownloadURL();
            }
            await db.ref('posts').push(postData);
            alert('✅ Publicado!'); switchTab('home'); selectedMediaFile = null; selectedMediaType = null;
        }

        function renderPlansPage(content) {
            content.innerHTML = `<div style="padding:10px;"><h3 style="text-align:center;margin:15px 0;">Seu Plano: <span style="color:var(--gold);">${PLANS[userPlan].name}</span></h3>
            <div class="plan-card"><h3>🆓 Gratuito</h3><ul class="plan-features"><li>5 vídeos/mês</li><li>30 imagens/mês</li><li>40 artigos/mês</li><li>3 downloads</li></ul>${userPlan==='free'?'<p style="color:var(--success);">✅ Plano atual</p>':''}</div>
            <div class="plan-card premium"><h3>⭐ Premium Mensal</h3><div class="plan-price">100 MT<small>/mês</small></div><ul class="plan-features"><li>50 vídeos/mês</li><li>200 imagens/mês</li><li>200 artigos/mês</li><li>50 downloads</li><li>✅ Promoção</li></ul><button class="btn btn-premium" onclick="upgradePlan('monthly')" ${userPlan==='monthly'?'disabled':''}>${userPlan==='monthly'?'✅ Plano Atual':'💎 Assinar'}</button></div>
            <div class="plan-card premium"><h3>👑 Premium Anual</h3><div class="plan-price">1.000 MT<small>/ano</small></div><ul class="plan-features"><li>500 vídeos/mês</li><li>2.000 imagens/mês</li><li>2.000 artigos/mês</li><li>500 downloads</li><li>✅ Tudo ilimitado!</li></ul><button class="btn btn-premium" onclick="upgradePlan('yearly')" ${userPlan==='yearly'?'disabled':''}>${userPlan==='yearly'?'✅ Plano Atual':'👑 Assinar'}</button></div>
            <div style="background:var(--card);border-radius:12px;padding:15px;margin:12px;text-align:center;"><h4>💳 Pagamento</h4><p style="font-size:12px;color:var(--text2);">📱 M-Pesa: 84 000 0000</p><p style="font-size:12px;color:var(--text2);">📱 E-Mola: 84 000 0000</p></div></div>`;
        }

        async function upgradePlan(type) {
            const phone = prompt('📱 Número para confirmação:');
            if(phone) { await db.ref('payments/upgrades').push({ userId: currentUser?.uid, phone: sanitize(phone), plan: type, amount: PLANS[type].price, timestamp: Date.now(), status: 'pending' }); alert('✅ Pedido enviado!'); }
        }

        function renderSupportPage(content) {
            content.innerHTML = `<div class="promote-card"><h3>🎧 Suporte Técnico</h3><input type="text" id="ticketSubject" class="promote-input" placeholder="Assunto"><textarea id="ticketMessage" class="promote-input" style="min-height:100px;" placeholder="Descreva seu problema..."></textarea><button class="btn btn-primary" onclick="submitTicket()">📤 Enviar Ticket</button></div>`;
        }
        async function submitTicket() {
            const subject = sanitize(document.getElementById('ticketSubject')?.value?.trim()||'');
            const message = sanitize(document.getElementById('ticketMessage')?.value?.trim()||'');
            if(!subject||!message) return alert('Preencha todos!');
            await db.ref('support/tickets').push({ subject, message, userId: currentUser?.uid, userName: sanitize(currentUser?.displayName||''), timestamp: Date.now(), status: 'open' });
            alert('✅ Ticket enviado!');
        }

        function toggleChat() { document.getElementById('chatPanel')?.classList.toggle('open'); }
        function loadChat() { db.ref('chat').limitToLast(30).on('child_added', s => { const m = s.val(), b = document.getElementById('chatBody'); if(b) { const d = document.createElement('div'); d.innerHTML = `<b>${sanitize(m.user||'Anónimo')}:</b> ${sanitize(m.text)}`; b.appendChild(d); b.scrollTop = b.scrollHeight; } }); }
        function sendChat() { const now = Date.now(); if(now - lastMessageTime < 3000) return alert('⏳ Aguarde 3s!'); lastMessageTime = now; const i = document.getElementById('chatInput'); if(!i) return; const t = sanitize(i.value.trim()); if(t) { db.ref('chat').push({ user: sanitize(currentUser?.displayName||'User'), text: t.substring(0,200), timestamp: Date.now() }); i.value = ''; } }
        function toggleSidebar() { document.getElementById('sidebar')?.classList.toggle('open'); document.getElementById('sidebarOverlay')?.classList.toggle('open'); }

        function setupAdminDetection() { const btn = document.querySelector('.bottom-nav .nav-item:first-child'); if(btn) btn.addEventListener('click', () => { if(!isAdmin && currentTab==='home') { homeClickCount++; if(homeClickTimer) clearTimeout(homeClickTimer); if(homeClickCount >= ADMIN_CLICKS) { homeClickCount = 0; document.getElementById('adminLock').classList.add('open'); } homeClickTimer = setTimeout(() => { homeClickCount = 0; }, 2000); } }); }
        async function verifyAdmin() { const p = document.getElementById('adminPassword')?.value; const s = await db.ref('config/adminPassword').once('value'); const stored = s.val(); if(!stored) await db.ref('config/adminPassword').set('clipcash2024'); if(p === (stored||'clipcash2024')) { isAdmin = true; document.getElementById('adminLock').classList.remove('open'); document.getElementById('adminPanel').classList.add('open'); } else alert('❌ Senha incorreta!'); }
        function closeAdminPanel() { document.getElementById('adminPanel').classList.remove('open'); isAdmin = false; }

        function adminConfigureTutorial() { const modal = document.getElementById('modalOverlay'), content = document.getElementById('modalContent'); modal.classList.add('open'); content.innerHTML = `<h3>📹 Configurar Vídeo Tutorial</h3><input type="text" id="tutorialUrl" class="promote-input" value="${tutorialConfig.url}"><input type="number" id="loopDuration" class="promote-input" value="${tutorialConfig.loopDuration}"><input type="text" id="captionText" class="promote-input" value="${tutorialConfig.caption}"><button class="btn btn-primary" onclick="saveTutorialConfig()">💾 Guardar</button><button class="btn btn-outline" style="margin-top:8px;" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cancelar</button>`; }
        function saveTutorialConfig() { const u = document.getElementById('tutorialUrl')?.value, d = document.getElementById('loopDuration')?.value, c = document.getElementById('captionText')?.value; if(u) tutorialConfig.url = u; if(d) tutorialConfig.loopDuration = parseInt(d); if(c) tutorialConfig.caption = sanitize(c); db.ref('config/tutorialVideo').set(tutorialConfig); document.getElementById('modalOverlay').classList.remove('open'); alert('✅ Guardado!'); }

        function adminConfigurePlacard() { const modal = document.getElementById('modalOverlay'), content = document.getElementById('modalContent'); modal.classList.add('open'); content.innerHTML = `<h3>💰 Configurar Links Placard</h3><label>Link de Afiliado</label><input type="text" id="depositLink" class="promote-input" value="${placardLinks.deposit}"><label>Link WhatsApp</label><input type="text" id="whatsappLink" class="promote-input" value="${placardLinks.whatsapp}"><button class="btn btn-primary" onclick="savePlacardConfig()">💾 Guardar</button><button class="btn btn-outline" style="margin-top:8px;" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cancelar</button>`; }
        function savePlacardConfig() { const d = document.getElementById('depositLink')?.value, w = document.getElementById('whatsappLink')?.value; if(d) placardLinks.deposit = d; if(w) placardLinks.whatsapp = w; db.ref('config/placardLinks').set(placardLinks); document.getElementById('modalOverlay').classList.remove('open'); alert('✅ Guardado!'); }

        function adminViewUpgrades() { alert('💎 Upgrades: Verifique no Firebase Console'); }
        function adminViewPromotions() { alert('🚀 Promoções: Verifique no Firebase Console'); }
        function adminSupportTickets() { alert('🎧 Suporte: Verifique no Firebase Console'); }
        function adminStats() { alert('📊 Estatísticas: Verifique no Firebase Console'); }
        async function adminChangePassword() { const p = prompt('Nova senha:'); if(p?.length >= 6) { await db.ref('config/adminPassword').set(p); alert('✅ Alterada!'); } }

        async function logout() { await auth.signOut(); currentUser = null; isLoggedIn = false; renderLoginScreen(); }

        // ==========================================
        // INIT
        // ==========================================
        async function initApp() {
            await loadConfig();
            const s = await db.ref('config/adminPassword').once('value');
            if(!s.val()) await db.ref('config/adminPassword').set('clipcash2024');
            auth.onAuthStateChanged(async (user) => {
                if(user) { currentUser = user; isLoggedIn = true; const snap = await db.ref(`users/${user.uid}`).once('value'); if(snap.exists()) { userPlan = snap.val().plan||'free'; userStats = snap.val().stats||userStats; } renderMainApp(); }
                else { renderLoginScreen(); }
            });
        }
        document.addEventListener('click', e => { if(e.target.classList.contains('sidebar-overlay')) toggleSidebar(); });
        initApp();
    </script>
</body>
</html>
